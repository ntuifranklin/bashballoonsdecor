name: Docker-Testing

on: 
  push:
    branches:
      - '**'
    

jobs:
  build-website:
    runs-on: node:20.7.0
    steps:
      - uses: actions/checkout@v2
      - name: Test Bash Balloons Rentals Website/WebApp
      - run: 
          echo ${{ secrets.GREEN_PEPPER_SPICES }} | base64 -d > ~/.webenv
          source ~/.webenv
          npm install .
          npm run test
  
  